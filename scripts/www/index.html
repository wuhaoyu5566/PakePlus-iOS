<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ff5722">
<title>卫航官方二手车</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',Arial,sans-serif;background:#e9ebee;color:#1a1a1a;font-size:14px;-webkit-font-smoothing:antialiased;}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:#f4f5f7;position:relative;overflow-x:hidden;padding-bottom:62px;}
@media(min-width:560px){#app{box-shadow:0 0 40px rgba(0,0,0,.15);}}
img{display:block;}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}
svg{display:block;}

/* ---------- 顶栏 ---------- */
.topbar{position:sticky;top:0;z-index:20;background:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0f0f0;}
.loc{font-size:13px;color:#333;display:flex;align-items:center;gap:3px;white-space:nowrap;font-weight:600;}
.search-box{flex:1;height:34px;background:#f4f5f7;border-radius:17px;display:flex;align-items:center;gap:6px;padding:0 12px;color:#9aa0a6;font-size:13px;}
.search-box input{flex:1;border:none;background:transparent;outline:none;font-size:13px;color:#1a1a1a;}
.search-box input::placeholder{color:#9aa0a6;}

/* ---------- 首页 Hero ---------- */
.hero{margin:12px 14px;border-radius:14px;padding:20px 18px;color:#fff;background:linear-gradient(120deg,#ff7a3d 0%,#ff5722 55%,#e63c0e 100%);position:relative;overflow:hidden;}
.hero::after{content:'';position:absolute;right:-40px;top:-40px;width:160px;height:160px;background:rgba(255,255,255,.12);border-radius:50%;pointer-events:none;}
.hero-title{font-size:19px;font-weight:700;line-height:1.35;letter-spacing:.5px;}
.hero-sub{margin-top:8px;font-size:12px;opacity:.9;}
.hero-badges{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.hero-badges span{background:rgba(255,255,255,.2);border-radius:20px;padding:4px 10px;font-size:11px;}

/* 联系方式 */
.hero-contacts{display:flex;gap:8px;margin-top:16px;position:relative;z-index:1;}
.hero-contact{flex:1;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.32);border-radius:10px;padding:8px 11px;color:#fff;text-decoration:none;display:flex;flex-direction:column;gap:3px;transition:background .15s;}
.hero-contact:active{background:rgba(255,255,255,.32);}
.hero-contact .hc-role{font-size:10.5px;opacity:.85;}
.hero-contact .hc-name{font-size:13px;font-weight:600;}
.hero-contact .hc-phone{font-size:14px;font-weight:700;letter-spacing:.4px;display:flex;align-items:center;gap:5px;}
.hero-contact .hc-phone svg{flex:0 0 auto;}

/* ---------- 区块标题 ---------- */
.section-head{display:flex;align-items:baseline;justify-content:space-between;padding:4px 16px 10px;}
.section-head h3{margin:0;font-size:16px;font-weight:700;}
.section-head span{font-size:12px;color:#9aa0a6;}

/* ---------- 车源卡片 ---------- */
.car-list{padding:0 12px;display:flex;flex-direction:column;gap:10px;}
.card{background:#fff;border-radius:12px;padding:10px;display:flex;gap:10px;transition:transform .12s ease;}
.card:active{transform:scale(.985);}
.card-img{position:relative;flex:0 0 128px;height:96px;border-radius:9px;overflow:hidden;background:#eee;}
.card-img img{width:100%;height:100%;object-fit:cover;}
.badge{position:absolute;left:0;top:0;font-size:10px;padding:2px 7px;border-radius:9px 0 9px 0;color:#fff;background:#ff5722;}
.card-body{flex:1;min-width:0;display:flex;flex-direction:column;}
.card-title{font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-meta{font-size:11px;color:#8a9099;margin-top:5px;}
.card-tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;}
.card-tags i{font-style:normal;font-size:10px;color:#ff5722;background:#fff1eb;border-radius:3px;padding:1px 5px;}
.card-foot{margin-top:auto;display:flex;align-items:baseline;gap:8px;padding-top:6px;}
.price{color:#ff5722;font-weight:700;font-size:15px;}
.price b{font-size:18px;}
.origin{font-size:11px;color:#b0b5bb;text-decoration:line-through;}
.down{font-size:11px;color:#8a9099;margin-left:auto;}

/* ---------- 筛选页 ---------- */
.filter-bar{position:sticky;top:0;z-index:15;background:#fff;border-bottom:1px solid #f0f0f0;}
.filter-tabs{display:flex;padding:0 6px;}
.filter-tabs div{flex:1;text-align:center;padding:11px 0;font-size:13px;color:#3c4148;position:relative;display:flex;align-items:center;justify-content:center;gap:3px;}
.filter-tabs div.on{color:#ff5722;font-weight:600;}
.filter-tabs div.on::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:20px;height:2px;background:#ff5722;border-radius:2px;}
.filter-panel{background:#fff;padding:14px 16px;border-bottom:1px solid #f0f0f0;}
.opt-wrap{display:flex;flex-wrap:wrap;gap:9px;}
.opt{padding:7px 14px;border-radius:6px;background:#f4f5f7;font-size:12.5px;color:#3c4148;}
.opt.on{background:#fff1eb;color:#ff5722;font-weight:600;}

/* ---------- 详情页 ---------- */
.detail{position:fixed;inset:0;max-width:480px;margin:0 auto;background:#f4f5f7;overflow-y:auto;z-index:50;padding-bottom:70px;}
.detail-nav{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;padding:10px 14px;}
.nav-btn{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;backdrop-filter:blur(4px);}
.gallery{height:250px;margin-top:-54px;background:#ddd;}
.gallery img{width:100%;height:100%;object-fit:cover;}
.gallery-dots{display:flex;justify-content:center;gap:5px;margin-top:10px;}
.gallery-dots i{width:5px;height:5px;border-radius:50%;background:#d5d8dc;}
.gallery-dots i.on{background:#ff5722;width:14px;border-radius:3px;}

.panel{background:#fff;border-radius:12px;margin:12px 12px 0;padding:16px;}
.d-price{color:#ff5722;font-size:26px;font-weight:700;}
.d-price small{font-size:14px;font-weight:600;}
.d-title{font-size:16px;font-weight:700;margin-top:8px;line-height:1.4;}
.d-tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.d-tags i{font-style:normal;font-size:11px;color:#ff5722;background:#fff1eb;border-radius:4px;padding:3px 8px;}

.spec-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#f0f1f3;border-radius:10px;overflow:hidden;}
.spec-grid div{background:#fff;padding:12px 6px;text-align:center;}
.spec-grid b{display:block;font-size:13.5px;font-weight:600;}
.spec-grid span{display:block;font-size:11px;color:#9aa0a6;margin-top:4px;}

.check-row{display:flex;align-items:center;gap:10px;margin-top:12px;}
.check-row:first-child{margin-top:0;}
.check-row .name{width:52px;font-size:12.5px;color:#5a6068;flex:0 0 auto;}
.bar{flex:1;height:6px;background:#f0f1f3;border-radius:3px;overflow:hidden;}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#ffa06b,#ff5722);}
.check-row .val{width:34px;text-align:right;font-size:12px;color:#ff5722;font-weight:600;flex:0 0 auto;}

.seller{display:flex;align-items:center;gap:12px;}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#ffb08a,#ff5722);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex:0 0 auto;}
.seller-info{flex:1;min-width:0;}
.seller-info b{font-size:14px;display:block;}
.seller-info span{font-size:11.5px;color:#9aa0a6;display:block;margin-top:3px;}
.desc-text{font-size:13px;line-height:1.75;color:#3c4148;}

.detail-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 -2px 12px rgba(0,0,0,.06);z-index:60;}
.bar-icon{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#8a9099;width:44px;flex:0 0 auto;}
.bar-icon.on{color:#ff5722;}
.btn-main{flex:1;height:44px;border-radius:22px;color:#fff;font-size:15px;font-weight:600;background:linear-gradient(120deg,#ff7a3d,#ff5722);}
.btn-ghost{flex:1;height:44px;border-radius:22px;font-size:15px;font-weight:600;color:#ff5722;background:#fff1eb;}

/* ---------- 底部导航 ---------- */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);display:flex;border-top:1px solid #eeeff1;z-index:40;padding-bottom:env(safe-area-inset-bottom);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;font-size:10.5px;color:#9aa0a6;}
.tab.on{color:#ff5722;}

/* ---------- 空状态 / 我的 ---------- */
.empty{text-align:center;padding:70px 20px;color:#b0b5bb;}
.empty p{font-size:13px;margin:14px 0 0;}
.mine-head{background:linear-gradient(120deg,#ff7a3d,#ff5722);padding:32px 20px 26px;color:#fff;display:flex;align-items:center;gap:14px;}
.mine-avatar{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;border:2px solid rgba(255,255,255,.5);}
.mine-head b{font-size:17px;display:block;}
.mine-head span{font-size:12px;opacity:.85;display:block;margin-top:5px;}
.mine-list{background:#fff;border-radius:12px;margin:12px;overflow:hidden;}
.mine-item{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid #f4f5f7;font-size:14px;}
.mine-item:last-child{border-bottom:none;}
.mine-item .arrow{margin-left:auto;color:#c8ccd1;font-size:16px;}
.mine-item .dot{width:8px;height:8px;border-radius:50%;background:#ff5722;}
.mine-item .num{margin-left:auto;color:#9aa0a6;font-size:13px;}

/* ---------- 管理页 ---------- */
.adm-head{position:sticky;top:0;z-index:20;background:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0f0f0;}
.adm-head b{font-size:16px;}
.adm-head .back{font-size:22px;color:#3c4148;line-height:1;padding:0 4px;}
.adm-list{padding:12px;display:flex;flex-direction:column;gap:10px;}
.adm-item{background:#fff;border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center;}
.adm-item img{width:80px;height:60px;border-radius:7px;object-fit:cover;background:#eee;flex:0 0 auto;}
.adm-info{flex:1;min-width:0;}
.adm-info b{font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.adm-info span{font-size:12px;color:#9aa0a6;display:block;margin-top:4px;}
.adm-btns{display:flex;flex-direction:column;gap:6px;flex:0 0 auto;}
.adm-btns button{font-size:12px;padding:5px 11px;border-radius:5px;}
.b-edit{background:#f0f1f3;color:#3c4148;}
.b-del{background:#fdecec;color:#e53935;}
.add-fab{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:452px;height:46px;border-radius:23px;background:linear-gradient(120deg,#ff7a3d,#ff5722);color:#fff;font-size:15px;font-weight:600;z-index:45;box-shadow:0 4px 14px rgba(255,87,34,.35);}

.form-wrap{padding:12px 12px 90px;}
.fld{margin-bottom:12px;}
.fld label{display:block;font-size:12.5px;color:#5a6068;margin-bottom:6px;}
.fld input,.fld select,.fld textarea{width:100%;height:42px;border:1px solid #e2e5e9;border-radius:8px;padding:0 11px;font-size:14px;font-family:inherit;outline:none;background:#fff;color:#1a1a1a;}
.fld textarea{height:88px;padding:10px 11px;resize:vertical;line-height:1.6;}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:#ff5722;}
.fld2{display:flex;gap:10px;}
.fld2>div{flex:1;}
.drop{border:1.5px dashed #d5d8dc;border-radius:9px;padding:18px;text-align:center;color:#9aa0a6;font-size:13px;cursor:pointer;background:#fff;}
.drop:active{border-color:#ff5722;color:#ff5722;background:#fffaf7;}
.img-grid{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px;}
.img-grid .im{position:relative;width:100px;height:75px;border-radius:7px;overflow:hidden;background:#eee;}
.img-grid .im img{width:100%;height:100%;object-fit:cover;}
.img-grid .im b{position:absolute;left:0;top:0;background:#ff5722;color:#fff;font-size:10px;padding:1px 6px;border-radius:0 0 6px 0;font-weight:500;}
.img-grid .im i{position:absolute;right:3px;top:3px;width:19px;height:19px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-style:normal;}
.img-grid .im .cover{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:10px;text-align:center;padding:2px 0;}
.save-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;padding:10px 14px;display:flex;gap:10px;box-shadow:0 -2px 12px rgba(0,0,0,.06);z-index:60;}
.save-bar button{height:44px;border-radius:22px;font-size:15px;font-weight:600;}
.tip{font-size:11.5px;color:#9aa0a6;line-height:1.7;padding:0 4px 10px;}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);color:#fff;padding:11px 20px;border-radius:9px;font-size:13px;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
 * 数据存储（浏览器本地数据库，关掉浏览器也不会丢）
 * =======================================================*/
let CARS = [];
let favorites = JSON.parse(localStorage.getItem('wheel_fav') || '[]');
let history  = JSON.parse(localStorage.getItem('wheel_history') || '[]');

function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('wh_cars_db', 1);
    r.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
    };
    r.onsuccess = e => res(e.target.result);
    r.onerror = e => rej(e.target.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const rq = db.transaction('kv','readonly').objectStore('kv').get(key);
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbSet(key, val){
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('kv','readwrite');
    tx.objectStore('kv').put(val, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function saveCars(){
  try { await idbSet('cars', CARS); }
  catch(e){ toast('保存失败，可能是图片太多'); }
}

/* =========================================================
 * 工具函数
 * =======================================================*/
const NOW_YEAR = new Date().getFullYear();
const BRAND_COLOR = { '卫航':'#1a5c9e' };

/* 销售经理 */
const SALES = [
  { name: '蒋春明', phone: '19962610018' },
  { name: '郭宇',   phone: '19962610998' }
];

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* 有真实图片用真实图片，没有就用占位图 */
function carImage(car){
  if (car.images && car.images.length) return car.images[0];
  const c = BRAND_COLOR[car.brand] || '#1a5c9e';
  const svg =
`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="${c}" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#14161a" stop-opacity="0.98"/>
  </linearGradient></defs>
  <rect width="640" height="440" fill="url(#g)"/>
  <circle cx="540" cy="80" r="140" fill="#ffffff" opacity="0.05"/>
  <path d="M120 300 L200 220 L440 220 L520 300 Z" fill="#ffffff" opacity="0.08"/>
  <circle cx="215" cy="305" r="34" fill="#ffffff" opacity="0.10"/>
  <circle cx="425" cy="305" r="34" fill="#ffffff" opacity="0.10"/>
  <text x="320" y="190" text-anchor="middle" font-size="52" font-family="PingFang SC,Helvetica,Arial" fill="#ffffff" opacity="0.92">${esc(car.brand||'卫航')}</text>
  <text x="320" y="240" text-anchor="middle" font-size="26" font-family="PingFang SC,Helvetica,Arial" fill="#ffffff" opacity="0.55">${esc(car.series||'')}</text>
</svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function carAge(car){ return NOW_YEAR - car.year; }
function downPayment(p){ return (p * 0.3).toFixed(1); }

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 1600);
}

/* =========================================================
 * 全局状态
 * =======================================================*/
const state = {
  tab: 'home',
  detailId: null,
  keyword: '',
  sort: 'default',
  panel: null,
  filters: { price:'不限', age:'不限', mileage:'不限', fuel:'不限', gearbox:'不限' },
  editId: null,
  editImages: []
};

function saveFav(){ localStorage.setItem('wheel_fav', JSON.stringify(favorites)); }
function saveHistory(){ localStorage.setItem('wheel_history', JSON.stringify(history.slice(0,20))); }

/* =========================================================
 * 筛选 & 排序
 * =======================================================*/
const PRICE_RANGES = { '不限':[0,Infinity],'20万以下':[0,20],'20-30万':[20,30],'30-40万':[30,40],'40-50万':[40,50],'50万以上':[50,Infinity] };
const AGE_RANGES   = { '不限':[0,99],'1年内':[0,1],'3年内':[0,3],'5年内':[0,5],'8年内':[0,8] };
const MILE_RANGES  = { '不限':[0,999],'1万内':[0,1],'3万内':[0,3],'5万内':[0,5],'10万内':[0,10] };
const FUEL_LIST    = ['不限','柴油','汽油','纯电','插混','增程'];
const GEAR_LIST    = ['不限','自动','手动'];

function getFiltered(){
  const f = state.filters, kw = state.keyword.trim().toLowerCase();
  let list = CARS.filter(car => {
    if (kw) {
      const text = ((car.series||'') + (car.spec||'')).toLowerCase();
      if (!text.includes(kw)) return false;
    }
    const [pmin,pmax] = PRICE_RANGES[f.price] || PRICE_RANGES['不限'];
    if (car.price < pmin || car.price >= pmax) return false;
    const [amin,amax] = AGE_RANGES[f.age] || AGE_RANGES['不限'];
    const age = carAge(car);
    if (age < amin || age > amax) return false;
    const [mmin,mmax] = MILE_RANGES[f.mileage] || MILE_RANGES['不限'];
    if (car.mileage < mmin || car.mileage > mmax) return false;
    if (f.fuel !== '不限' && car.fuel !== f.fuel) return false;
    if (f.gearbox !== '不限' && car.gearbox !== f.gearbox) return false;
    return true;
  });
  if (state.sort === 'priceAsc')  list.sort((a,b)=>a.price-b.price);
  if (state.sort === 'priceDesc') list.sort((a,b)=>b.price-a.price);
  if (state.sort === 'mileAsc')   list.sort((a,b)=>a.mileage-b.mileage);
  if (state.sort === 'ageAsc')    list.sort((a,b)=>(b.year*12+b.month)-(a.year*12+a.month));
  return list;
}

/* =========================================================
 * 视图组件
 * =======================================================*/
function carCard(car){
  const tags = (car.tags||[]).map(t=>`<i>${esc(t)}</i>`).join('');
  return `
  <div class="card" onclick="openDetail(${car.id})">
    <div class="card-img">
      <img src="${carImage(car)}" alt="">
      <span class="badge">官方直营</span>
    </div>
    <div class="card-body">
      <div class="card-title">${esc(car.brand||'卫航')} ${esc(car.series)} ${esc(car.spec)}</div>
      <div class="card-meta">${car.year}年${car.month}月 · ${car.mileage}万公里 · ${esc(car.gearbox)} · ${esc(car.fuel)}</div>
      <div class="card-tags">${tags}</div>
      <div class="card-foot">
        <div class="price"><b>${car.price}</b>万</div>
        ${car.newPrice ? `<div class="origin">${car.newPrice}万</div>` : ''}
        <div class="down">首付${downPayment(car.price)}万</div>
      </div>
    </div>
  </div>`;
}

function emptyView(text){

/* 压缩图片 */
function compressImage(file, maxW, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.width, h = img.height;
      if (w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      resolve(cv.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片读取失败')); };
    img.src = url;
  });
}

async function pickImages(e){
  const files = Array.from(e.target.files);
  e.target.value = '';
  if (!files.length) return;
  toast('处理中…');
  for (const f of files){
    if (!f.type.startsWith('image/')) continue;
    try { state.editImages.push(await compressImage(f, 800, 0.72)); }
    catch(err){ /* 跳过失败项 */ }
  }
  renderImgBox();
  toast('已添加 ' + files.length + ' 张');
}

async function saveForm(){

  const series = v('f_series'), spec = v('f_spec');

  const mileage = Number(v('f_mileage')), price = Number(v('f_price'));
  if (!series || !spec) return toast('请填写系列和配置');
  if (!year || !month)  return toast('请填写上牌时间');
  if (!mileage)         return toast('请填写里程');
  if (!price)           return toast('请填写售价');

  const obj = {
    id: state.editId === 'new' ? Date.now() : state.editId,
    brand: '卫航',
    city: '扬州',
    series, spec, year, month, mileage, price,
    gearbox: document.getElementById('f_gearbox').value,
    fuel: document.getElementById('f_fuel').value,
    disp: v('f_disp'),
    newPrice: Number(v('f_newPrice')) || 0,
    tags: v('f_tags').split(/[,，]/).map(s=>s.trim()).filter(Boolean),
    desc: v('f_desc'),
    images: state.editImages.slice()
  };

  if (state.editId === 'new'){
    CARS.unshift(obj);
  } else {
    const i = CARS.findIndex(c => c.id === state.editId);
    if (i > -1) CARS[i] = obj;
  }

  await saveCars();
  toast('保存成功');

  state.editImages = [];
  render();
}

  if (appEl) appEl.innerHTML = '';
  const toastEl = clone.querySelector('#toast');
  if (toastEl){ toastEl.textContent = ''; toastEl.classList.remove('show'); }
  const bodyEl = clone.querySelector('body');
  if (bodyEl) bodyEl.removeAttribute('style');

  let html = '<!DOCTYPE html>\n' + clone.outerHTML;

  const startMark = '(async function(){';
  const endMark = '})();';
  const s = html.indexOf(startMark);
  if (s === -1) return toast('导出失败：未找到启动代码');
  const e = html.indexOf(endMark, s);
  if (e === -1) return toast('导出失败：启动代码不完整');

  const json = JSON.stringify(CARS).replace(/</g, '\\u003c');
  const inject =
    'window.__PUBLISH_CARS__ = ' + json + ';\n' +
    'CARS = window.__PUBLISH_CARS__ || [];\n' +
    'render();';
  html = html.slice(0, s) + inject + html.slice(e + endMark.length);

  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '卫航二手车_展示版.html';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('已导出展示版，发给别人双击即可查看');
}

/* 备份 / 恢复 */
function exportBackup(){
  if (!CARS.length) return toast('还没有车源');
  const blob = new Blob([JSON.stringify(CARS, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '卫航车源备份_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
  toast('已下载备份文件');
}
function importBackup(e){
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data)) throw new Error('文件格式不对');
      if (!confirm('恢复将覆盖当前车源，确定继续？')) return;
      CARS = data;
      await saveCars();
      toast('恢复成功，共 ' + data.length + ' 台');
      render();
    } catch(err){ toast('恢复失败：' + err.message); }
  };
  reader.readAsText(file);
}

/* =========================================================
 * 渲染 & 事件
 * =======================================================*/
const TABBAR = `
<div class="tabbar">
  ${tabItem('home','首页','<path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>')}
  ${tabItem('filter','找车','<circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>')}
  ${tabItem('fav','收藏','<path d="M12 21s-7-4.5-9.5-8.5C.8 9.2 2.3 5.5 5.8 5.5c2 0 3.4 1.1 4.2 2.3.8-1.2 2.2-2.3 4.2-2.3 3.5 0 5 3.7 3.3 7C19 16.5 12 21 12 21z"/>')}
  ${tabItem('mine','我的','<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>')}
</div>`;

function tabItem(key, label, path){
  const on = state.tab === key;
  return `<div class="tab ${on?'on':''}" onclick="go('${key}')">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${path}</svg>
    <span>${label}</span>
  </div>`;
}

function render(){
  const app = document.getElementById('app');

  if (state.detailId) {
    app.innerHTML = detailView();
    document.body.style.overflow = 'hidden';
    return;
  }
  document.body.style.overflow = '';

  if (state.tab === 'admin') {
    app.innerHTML = adminView();
    if (state.editId !== null) renderImgBox();
    window.scrollTo(0, 0);
    return;
  }

  let body = '';
  switch(state.tab){
    case 'home':   body = homeView();   break;
    case 'filter': body = filterView(); break;
    case 'fav':    body = favView();    break;
    case 'mine':   body = mineView();   break;
  }
  app.innerHTML = body + TABBAR;
}

/* ---------- 导航 ---------- */
function go(tab){
  state.tab = tab;
  state.detailId = null;
  state.panel = null;
  state.editId = null;
  state.editImages = [];
  render();
  window.scrollTo(0,0);
}
function openDetail(id){
  state.detailId = id;
  if (!history.includes(id)) { history.unshift(id); saveHistory(); }
  render();
}
function closeDetail(){ state.detailId = null; render(); }

/* ---------- 筛选交互 ---------- */
function togglePanel(key){
  state.panel = (state.panel === key) ? null : key;
  render();
}
function pickOption(key, value){
  state.filters[key] = value;
  render();
}
function resetFilter(){
  state.filters = { price:'不限', age:'不限', mileage:'不限', fuel:'不限', gearbox:'不限' };
  state.keyword = '';
  state.panel = null;
  render();
}
function onSortChange(e){ state.sort = e.target.value; render(); }

function onSearchInput(e){
  state.keyword = e.target.value;
  const list = getFiltered();
  const box = document.getElementById('resultList');
  if (box) box.innerHTML = list.length ? list.map(carCard).join('') : emptyView('没有找到符合条件的车源');
  const cnt = document.getElementById('resultCount');
  if (cnt) cnt.textContent = list.length;
}

/* ---------- 收藏 ---------- */
function toggleFav(id){
  const i = favorites.indexOf(id);
  if (i > -1) { favorites.splice(i,1); toast('已取消收藏'); }
  else { favorites.push(id); toast('已加入收藏'); }
  saveFav();
  render();
}

/* =========================================================
 * 启动
 * =======================================================*/
(async function(){
  try { CARS = (await idbGet('cars')) || []; }
  catch(e){ CARS = []; }
  render();
})();
</script>
