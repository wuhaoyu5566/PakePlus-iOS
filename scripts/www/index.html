<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
 * 数据存储
 * =======================================================*/
let CARS = [];
let favorites = JSON.parse(localStorage.getItem('wheel_fav') || '[]');
let history  = JSON.parse(localStorage.getItem('wheel_history') || '[]');

function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('wh_cars_db', 1);
    r.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
    };
    r.onsuccess = e => res(e.target.result);
    r.onerror = e => rej(e.target.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const rq = db.transaction('kv','readonly').objectStore('kv').get(key);
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbSet(key, val){
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('kv','readwrite');
    tx.objectStore('kv').put(val, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function saveCars(){
  try { await idbSet('cars', CARS); }
  catch(e){ toast('保存失败，可能是图片太多'); }
}

/* =========================================================
 * 常量
 * =======================================================*/
const NOW_YEAR = new Date().getFullYear();
const BRAND_COLOR = { '卫航':'#1a5c9e' };

const SALES = [
  { name: '蒋春明', phone: '19962610018' },
  { name: '郭宇',   phone: '19962610998' }
];

const FACTORY_ADDR  = '仪征市陈集镇兴业路15号江苏卫航房车';
const FACTORY_ADDR1 = '仪征市陈集镇兴业路15号';
const FACTORY_ADDR2 = '江苏卫航房车';

const HERO_DEFAULT = {
  sub: '工厂直营 · 原厂专业整备',
  badges: ['1年质保', '工厂直销'],
  bgFrom: '#1a1a1a',
  bgTo: '#333333'
};
let HERO = Object.assign({}, HERO_DEFAULT);

const CHECK_TITLE = '车况检测报告';
const CHECK_TAG   = '原厂专业整备检测通过';
const CHECK_DESC_DEFAULT = '经检测：无重大事故、无泡水、无火烧，支持第三方机构复检，检测结果不符可全额退车。';

const SHARE_ICON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>';

function defaultChecks(car){
  if (car && (car.fuel === '汽油' || car.fuel === '柴油')){
    return [
      {name:'外观', score:4.7},{name:'内饰', score:4.5},{name:'发动机', score:4.8},
      {name:'变速箱', score:4.7},{name:'底盘', score:4.6},{name:'骨架', score:5.0}
    ];
  }
  return [
    {name:'外观', score:4.6},{name:'内饰', score:4.4},{name:'电池健康', score:4.7},
    {name:'电机', score:4.8},{name:'底盘', score:4.6},{name:'骨架', score:5.0}
  ];
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function carImage(car){
  if (car.images && car.images.length) return car.images[0];
  const c = BRAND_COLOR[car.brand] || '#1a5c9e';
  const svg =
`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="${c}" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#14161a" stop-opacity="0.98"/>
  </linearGradient></defs>
  <rect width="640" height="440" fill="url(#g)"/>
  <circle cx="540" cy="80" r="140" fill="#ffffff" opacity="0.05"/>
  <path d="M120 300 L200 220 L440 220 L520 300 Z" fill="#ffffff" opacity="0.08"/>
  <circle cx="215" cy="305" r="34" fill="#ffffff" opacity="0.10"/>
  <circle cx="425" cy="305" r="34" fill="#ffffff" opacity="0.10"/>
  <text x="320" y="190" text-anchor="middle" font-size="52" font-family="PingFang SC,Helvetica,Arial" fill="#ffffff" opacity="0.92">${esc(car.brand||'卫航')}</text>
  <text x="320" y="240" text-anchor="middle" font-size="26" font-family="PingFang SC,Helvetica,Arial" fill="#ffffff" opacity="0.55">${esc(car.series||'')}</text>
</svg>`;

 * 筛选 & 排序

const PRICE_RANGES = { '不限':[0,Infinity],'20万以下':[0,20],'20-30万':[20,30],'30-40万':[30,40],'40-50万':[40,50],'50万以上':[50,Infinity] };
const AGE_RANGES   = { '不限':[0,99],'1年内':[0,1],'3年内':[0,3],'5年内':[0,5],'8年内':[0,8] };
const MILE_RANGES  = { '不限':[0,999],'1万内':[0,1],'3万内':[0,3],'5万内':[0,5],'10万内':[0,10] };
const FUEL_LIST    = ['不限','柴油','汽油','纯电','插混','增程'];
const GEAR_LIST    = ['不限','自动','手动'];

function getFiltered(){
  const f = state.filters, kw = state.keyword.trim().toLowerCase();
  let list = CARS.filter(car => {
    if (kw) {
      const text = ((car.series||'') + (car.spec||'')).toLowerCase();
      if (!text.includes(kw)) return false;
    }
    const [pmin,pmax] = PRICE_RANGES[f.price] || PRICE_RANGES['不限'];
    if (car.price < pmin || car.price >= pmax) return false;
    const [amin,amax] = AGE_RANGES[f.age] || AGE_RANGES['不限'];
    const age = carAge(car);
    if (age < amin || age > amax) return false;
    const [mmin,mmax] = MILE_RANGES[f.mileage] || MILE_RANGES['不限'];
    if (car.mileage < mmin || car.mileage > mmax) return false;
    if (f.fuel !== '不限' && car.fuel !== f.fuel) return false;
    if (f.gearbox !== '不限' && car.gearbox !== f.gearbox) return false;
    return true;
  });
  if (state.sort === 'priceAsc')  list.sort((a,b)=>a.price-b.price);
  if (state.sort === 'priceDesc') list.sort((a,b)=>b.price-a.price);
  if (state.sort === 'mileAsc')   list.sort((a,b)=>a.mileage-b.mileage);
  if (state.sort === 'ageAsc')    list.sort((a,b)=>(b.year*12+b.month)-(a.year*12+a.month));
  return list;
}

/* ---------- 分享文字 ---------- */
function carShareText(car){
  const lines = [
    '卫航官方二手车',
    HERO.sub || '工厂直营 · 原厂专业整备',
    '',
    `${car.brand||'卫航'} ${car.series} ${car.spec}`,
    `${car.year}年${car.month}月 · ${car.mileage}万公里 · ${car.gearbox} · ${car.fuel}`,
    `售价：${car.price}万${car.newPrice ? '（新车指导价 ' + car.newPrice + '万）' : ''}`,
    '',
    '销售经理：'
  ];
  SALES.forEach(s => lines.push(`${s.name}  ${s.phone}`));
  lines.push('');
  lines.push('工厂地址：' + FACTORY_ADDR);
  return lines.join('\n');
}

async function doShareText(carId){
  closeShareSheet();
  const car = CARS.find(c => c.id === carId);
  if (!car) return;
  const text = carShareText(car);
  try {
    if (navigator.share){
      await navigator.share({ title: '卫航官方二手车', text });
      return;
    }
  } catch(e){}
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast('文字已复制，可粘贴到微信发送');
  } catch(e){
    toast('复制失败，请手动复制');
  }
}

  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error('load fail'));
    img.src = src;
  });
}

function drawRoundRectPath(ctx, x, y, w, h, r){
  if (ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

async function buildCarShareImage(car){
  const W = 900, H = 1580;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');

  ctx.fillStyle = '#f4f5f7';
  ctx.fillRect(0, 0, W, H);

  // 顶部 Hero
  const heroH = 380;
  const g = ctx.createLinearGradient(0, 0, W, heroH);
  g.addColorStop(0, HERO.bgFrom || '#1a1a1a');
  g.addColorStop(1, HERO.bgTo || '#333333');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, heroH);

  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.beginPath(); ctx.arc(W - 40, 40, 220, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold 52px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('卫航官方二手车', 50, 110);

  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  ctx.font = '26px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(HERO.sub || '工厂直营 · 原厂专业整备', 50, 165);

  let tagX = 50;
  const tagY = 200;
  ctx.font = '24px "PingFang SC","Microsoft YaHei",sans-serif';
  (HERO.badges || []).forEach(b => {
    const tw = ctx.measureText(b).width;
    const pw = tw + 40;
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    drawRoundRectPath(ctx, tagX, tagY, pw, 46, 23);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillText(b, tagX + 20, tagY + 32);
    tagX += pw + 12;
  });

  ctx.fillStyle = 'rgba(255,255,255,0.72)';
  ctx.font = '24px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('在售车源 ' + CARS.length + ' 台', 50, 320);

  // 车图
  const imgX = 40, imgY = 420, imgW = W - 80, imgH = 500;
  ctx.save();
  drawRoundRectPath(ctx, imgX, imgY, imgW, imgH, 20);
  ctx.clip();
  ctx.fillStyle = '#e9ebee';
  ctx.fillRect(imgX, imgY, imgW, imgH);
  try {
    const im = await loadImage(carImage(car));
    const ir = im.width / im.height, br = imgW / imgH;
    let sx, sy, sw, sh;
    if (ir > br){ sh = im.height; sw = sh * br; sx = (im.width - sw)/2; sy = 0; }
    else { sw = im.width; sh = sw / br; sx = 0; sy = (im.height - sh)/2; }
    ctx.drawImage(im, sx, sy, sw, sh, imgX, imgY, imgW, imgH);
  } catch(e){}
  ctx.restore();

  // 车名
  ctx.fillStyle = '#1a1a1a';
  ctx.font = 'bold 38px "PingFang SC","Microsoft YaHei",sans-serif';
  const title = (car.brand||'卫航') + ' ' + (car.series||'') + ' ' + (car.spec||'');
  ctx.fillText(title, 50, imgY + imgH + 70);

  // 参数
  ctx.fillStyle = '#8a9099';
  ctx.font = '24px "PingFang SC","Microsoft YaHei",sans-serif';
  const meta = [car.year + '年' + car.month + '月', car.mileage + '万公里', car.gearbox, car.fuel].filter(Boolean).join('  ·  ');
  ctx.fillText(meta, 50, imgY + imgH + 120);

  // 价格
  ctx.fillStyle = '#ff5722';
  ctx.font = 'bold 56px "PingFang SC","Microsoft YaHei",sans-serif';
  const priceStr = car.price + '万';
  ctx.fillText(priceStr, 50, imgY + imgH + 200);
  if (car.newPrice){
    ctx.fillStyle = '#b0b5bb';
    ctx.font = '26px "PingFang SC","Microsoft YaHei",sans-serif';
    const pw = ctx.measureText(priceStr).width;
    ctx.fillText('新车 ' + car.newPrice + '万', 50 + pw + 24, imgY + imgH + 195);
  }

  // 分隔线
  const lineY = imgY + imgH + 240;
  ctx.strokeStyle = '#e2e5e9';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(50, lineY); ctx.lineTo(W-50, lineY); ctx.stroke();

  // 经理卡片（两列）
  const cardY = lineY + 30;
  const cardW = (W - 100 - 20) / 2;
  const cardH = 130;
  SALES.forEach((s, i) => {
    const x = 50 + i * (cardW + 20);
    ctx.fillStyle = '#ffffff';
    drawRoundRectPath(ctx, x, cardY, cardW, cardH, 16);
    ctx.fill();
    ctx.fillStyle = '#ff5722';
    drawRoundRectPath(ctx, x, cardY, 8, cardH, 4);
    ctx.fill();
    ctx.fillStyle = '#8a9099';
    ctx.font = '20px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('销售经理', x + 28, cardY + 40);
    ctx.fillStyle = '#1a1a1a';
    ctx.font = 'bold 32px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(s.name, x + 28, cardY + 86);
    ctx.fillStyle = '#ff5722';
    ctx.font = 'bold 26px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(s.phone, x + 28, cardY + 118);
  });

  // 地址卡片
  const addrY = cardY + cardH + 20;
  const addrH = 120;
  ctx.fillStyle = '#ffffff';
  drawRoundRectPath(ctx, 50, addrY, W - 100, addrH, 16);
  ctx.fill();
  ctx.fillStyle = '#ff5722';
  drawRoundRectPath(ctx, 50, addrY, 8, addrH, 4);
  ctx.fill();
  ctx.fillStyle = '#8a9099';
  ctx.font = '20px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('工厂地址', 78, addrY + 40);
  ctx.fillStyle = '#1a1a1a';
  ctx.font = 'bold 28px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(FACTORY_ADDR1, 78, addrY + 80);
  ctx.fillStyle = '#5a6068';
  ctx.font = '22px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(FACTORY_ADDR2, 78, addrY + 110);

  // 底部
  ctx.fillStyle = '#9aa0a6';
  ctx.font = '22px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('原厂专业整备 · 官方认证车源', W/2, H - 40);

  return new Promise(res => cv.toBlob(b => res(b), 'image/jpeg', 0.92));
}

async function buildSharePage(cars){
  closeShareSheet();
  const clone = document.documentElement.cloneNode(true);
  const appEl = clone.querySelector('#app');
  if (appEl) appEl.innerHTML = '';
  const toastEl = clone.querySelector('#toast');
  if (toastEl){ toastEl.textContent = ''; toastEl.classList.remove('show'); }
  const bodyEl = clone.querySelector('body');
  if (bodyEl) bodyEl.removeAttribute('style');

  let html = '<!DOCTYPE html>\n' + clone.outerHTML;

  const startMark = '(async function(){';
  const endMark = '})();';
  const s = html.indexOf(startMark);
  if (s === -1) throw new Error('未找到启动代码');
  const e = html.indexOf(endMark, s);
  if (e === -1) throw new Error('启动代码不完整');

  const jsonCars = JSON.stringify(cars).replace(/</g, '\\u003c');
  const jsonHero = JSON.stringify(HERO).replace(/</g, '\\u003c');
  const inject =
    'window.__PUBLISH_CARS__ = ' + jsonCars + ';\n' +
    'CARS = window.__PUBLISH_CARS__ || [];\n' +
    'window.__PUBLISH_HERO__ = ' + jsonHero + ';\n' +
    'HERO = Object.assign({}, HERO_DEFAULT, window.__PUBLISH_HERO__ || {});\n' +
    'render();';
  html = html.slice(0, s) + inject + html.slice(e + endMark.length);
  return html;
}

function renderCheckBox(){
  const box = document.getElementById('chkBox');
  if (!box) return;
  if (!state.editChecks.length){
    box.innerHTML = `<div style="font-size:12px;color:#9aa0a6;padding:4px 0;">暂无检测项，点下面按钮添加</div>`;
    return;
  }
  box.innerHTML = state.editChecks.map((c, i) => `
    <div class="chk-row">
      <input type="text" value="${esc(c.name)}" placeholder="项目名（如：外观）"
             oninput="updateCheck(${i},'name',this.value)">
      <input type="number" value="${c.score}" min="0" max="5" step="0.1"
             oninput="updateCheck(${i},'score',this.value)">
      <button type="button" class="chk-del" onclick="delCheck(${i})">✕</button>
    </div>`).join('');
}
function updateCheck(i, key, val){
  if (!state.editChecks[i]) return;
  state.editChecks[i][key] = (key === 'score') ? Number(val) : val;
}
function addCheck(){
  state.editChecks.push({ name: '', score: 5 });
  renderCheckBox();
}
function delCheck(i){
  state.editChecks.splice(i, 1);
  renderCheckBox();
}

function renderImgBox(){
  const box = document.getElementById('imgBox');
  if (!box) return;
  box.innerHTML = state.editImages.map((u,i) => `
    <div class="im">
      <img src="${u}" alt="">

    </div>`).join('');
}
function delImg(i){ state.editImages.splice(i,1); renderImgBox(); }
function setCover(i){
  const [u] = state.editImages.splice(i,1);
  state.editImages.unshift(u);
  renderImgBox();
}

function compressImage(file, maxW, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.width, h = img.height;
      if (w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      resolve(cv.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片读取失败')); };
    img.src = url;
  });
}

async function pickImages(e){
  const files = Array.from(e.target.files);
  e.target.value = '';
  if (!files.length) return;
  toast('处理中…');
  for (const f of files){
    if (!f.type.startsWith('image/')) continue;
    try { state.editImages.push(await compressImage(f, 800, 0.72)); }
    catch(err){}
  }
  renderImgBox();
  toast('已添加 ' + files.length + ' 张');
}

  if (!mileage)         return toast('请填写里程');
  if (!price)           return toast('请填写售价');

  const checks = state.editChecks
    .map(c => ({ name: (c.name || '').trim(), score: Math.max(0, Math.min(5, Number(c.score) || 0)) }))
    .filter(c => c.name);

  const obj = {
    id: state.editId === 'new' ? Date.now() : state.editId,
    brand: '卫航',
    city: '扬州',
    series, spec, year, month, mileage, price,
    gearbox: document.getElementById('f_gearbox').value,
    fuel: document.getElementById('f_fuel').value,
    disp: v('f_disp'),
    newPrice: Number(v('f_newPrice')) || 0,
    tags: v('f_tags').split(/[,，]/).map(s=>s.trim()).filter(Boolean),
    desc: v('f_desc'),
    checkDesc: v('f_checkDesc'),
    checks: checks,
    images: state.editImages.slice()
  };

  if (state.editId === 'new'){
    CARS.unshift(obj);
  } else {
    const i = CARS.findIndex(c => c.id === state.editId);
    if (i > -1) CARS[i] = obj;
  }

  await saveCars();
  toast('保存成功');
  state.editId = null;
  state.editImages = [];
  state.editChecks = [];
  render();
}

async function delCar(id){
  if (!confirm('确定删除这台车吗？')) return;
  CARS = CARS.filter(c => c.id !== id);
  await saveCars();
  toast('已删除');
  render();
}

function exportBackup(){
  if (!CARS.length) return toast('还没有车源');
  const blob = new Blob([JSON.stringify(CARS, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '卫航车源备份_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
  toast('已下载备份文件');
}
function importBackup(e){
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data)) throw new Error('文件格式不对');
      if (!confirm('恢复将覆盖当前车源，确定继续？')) return;
      CARS = data;
      await saveCars();
      toast('恢复成功，共 ' + data.length + ' 台');
      render();
    } catch(err){ toast('恢复失败：' + err.message); }
  };
  reader.readAsText(file);
}

/* =========================================================
 * 渲染 & 事件
 * =======================================================*/
const TABBAR = `
<div class="tabbar">
  ${tabItem('home','首页','<path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>')}
  ${tabItem('filter','找车','<circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>')}
  ${tabItem('fav','收藏','<path d="M12 21s-7-4.5-9.5-8.5C.8 9.2 2.3 5.5 5.8 5.5c2 0 3.4 1.1 4.2 2.3.8-1.2 2.2-2.3 4.2-2.3 3.5 0 5 3.7 3.3 7C19 16.5 12 21 12 21z"/>')}
  ${tabItem('mine','我的','<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>')}
</div>`;

function tabItem(key, label, path){
  const on = state.tab === key;
  return `<div class="tab ${on?'on':''}" onclick="go('${key}')">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${path}</svg>
    <span>${label}</span>
  </div>`;
}

function render(){
  const app = document.getElementById('app');

  if (state.detailId) {
    app.innerHTML = detailView();
    document.body.style.overflow = 'hidden';
    return;
  }
  document.body.style.overflow = '';

  if (state.tab === 'admin') {
    app.innerHTML = adminView();
    if (state.editId !== null) {
      renderImgBox();
      renderCheckBox();
    }
    window.scrollTo(0, 0);
    return;
  }

  if (state.tab === 'heroEdit') {
    app.innerHTML = heroEditView();
    window.scrollTo(0, 0);
    return;
  }

  if (state.tab === 'shareImg') {
    app.innerHTML = shareImgView();
    window.scrollTo(0, 0);
    return;
  }

  let body = '';
  switch(state.tab){
    case 'home':   body = homeView();   break;
    case 'filter': body = filterView(); break;
    case 'fav':    body = favView();    break;
    case 'mine':   body = mineView();   break;
  }
  app.innerHTML = body + TABBAR;
}

function go(tab){
  state.tab = tab;
  state.detailId = null;
  state.panel = null;
  state.editId = null;
  state.editImages = [];
  state.editChecks = [];
  closeShareSheet();
  render();
  window.scrollTo(0,0);
}
function openDetail(id){
  state.detailId = id;
  if (!history.includes(id)) { history.unshift(id); saveHistory(); }
  render();
}
function closeDetail(){ state.detailId = null; render(); }

function togglePanel(key){
  state.panel = (state.panel === key) ? null : key;
  render();
}
function pickOption(key, value){
  state.filters[key] = value;
  render();
}
function resetFilter(){
  state.filters = { price:'不限', age:'不限', mileage:'不限', fuel:'不限', gearbox:'不限' };
  state.keyword = '';
  state.panel = null;
  render();
}
function onSortChange(e){ state.sort = e.target.value; render(); }

function onSearchInput(e){
  state.keyword = e.target.value;
  const list = getFiltered();
  const box = document.getElementById('resultList');
  if (box) box.innerHTML = list.length ? list.map(carCard).join('') : emptyView('没有找到符合条件的车源');
  const cnt = document.getElementById('resultCount');
  if (cnt) cnt.textContent = list.length;
}

function toggleFav(id){
  const i = favorites.indexOf(id);
  if (i > -1) { favorites.splice(i,1); toast('已取消收藏'); }
  else { favorites.push(id); toast('已加入收藏'); }
  saveFav();
  render();
}

/* =========================================================
 * 启动
 * =======================================================*/
(async function(){
  try {
    CARS = (await idbGet('cars')) || [];
    const h = await idbGet('hero');
    if (h) HERO = Object.assign({}, HERO_DEFAULT, h);
  } catch(e){
    CARS = [];
  }
  render();
})();
</script>
